<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bartos — Catálogo</title><style>:root{--purple:#7843d7;--yellow:#ffe55c;--black:#17151e}*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#faf9fd;color:var(--black)}header{background:var(--yellow);padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{font-size:38px;letter-spacing:-2px;margin:0}header p{margin:5px 0 0}main{max-width:1100px;margin:auto;padding:25px 18px}input{width:100%;padding:15px;border:1px solid #ddd;border-radius:14px;font-size:16px}.chips{display:flex;gap:9px;overflow-x:auto;padding:17px 0}.chips button{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:30px;padding:10px 15px;cursor:pointer}.chips button.active{background:var(--purple);color:white}.section{margin:16px 0 36px}.section h2{margin:0 0 14px}.gallery{display:flex;overflow-x:auto;gap:16px;scroll-snap-type:x mandatory;padding-bottom:12px}.card{background:white;border:1px solid #eee;border-radius:18px;min-width:245px;width:245px;overflow:hidden;scroll-snap-align:start}.photo{height:190px;background:#ede7f8;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:54px}.details{padding:15px}.details h3{margin:0 0 8px;font-size:18px}.details p{font-size:13px;color:#666;min-height:38px}.price{font-weight:800}.buy{display:block;text-align:center;margin-top:13px;padding:12px;background:var(--purple);color:white;border-radius:10px;text-decoration:none;font-weight:700}footer{text-align:center;padding:35px;color:#777}#empty{display:none;color:#666}</style></head><body><header><h1>bartos.</h1><p>Ideias que ganham forma. ✨</p></header><main><h2>Nosso catálogo</h2><input id="search" placeholder="Buscar produtos..." aria-label="Buscar produtos"><nav id="chips" class="chips" aria-label="Categorias"></nav><div id="catalog"></div><p id="empty">Nenhum produto encontrado.</p></main><footer>Feito com criatividade pela Bartos • Impressão 3D</footer><script src="produtos.js"></script><script>const whatsapp=CONFIG.whatsapp.replace(/\D/g,'');const search=document.querySelector('#search'),chips=document.querySelector('#chips'),catalog=document.querySelector('#catalog'),empty=document.querySelector('#empty');let selected='Todos';const cats=['Todos',...new Set(PRODUTOS.map(p=>p.categoria))];function render(){const q=search.value.toLocaleLowerCase('pt-BR').trim();chips.replaceChildren();cats.forEach(cat=>{let b=document.createElement('button');b.textContent=cat;b.className=cat===selected?'active':'';b.onclick=()=>{selected=cat;render()};chips.append(b)});catalog.replaceChildren();let visible=PRODUTOS.filter(p=>(selected==='Todos'||p.categoria===selected)&&[p.nome,p.descricao,p.codigo].join(' ').toLocaleLowerCase('pt-BR').includes(q));empty.style.display=visible.length?'none':'block';let groups=selected==='Todos'?cats.slice(1):[selected];groups.forEach(cat=>{let items=visible.filter(p=>p.categoria===cat);if(!items.length)return;let sec=document.createElement('section');sec.className='section';let h=document.createElement('h2');h.textContent=cat;let gallery=document.createElement('div');gallery.className='gallery';items.forEach(p=>{let card=document.createElement('article');card.className='card';let photo=document.createElement('div');photo.className='photo';if(p.imagem){let img=document.createElement('img');img.src=p.imagem;img.alt=p.nome;img.loading='lazy';photo.append(img)}else{let span=document.createElement('span');span.className='placeholder';span.textContent='✦';photo.append(span)}let d=document.createElement('div');d.className='details';let title=document.createElement('h3');title.textContent=p.nome;let desc=document.createElement('p');desc.textContent=p.descricao||'';let price=document.createElement('div');price.className='price';price.textContent=p.preco||'Sob orçamento';let buy=document.createElement('a');buy.className='buy';buy.textContent='Eu quero!';buy.target='_blank';buy.rel='noopener noreferrer';buy.href='https://wa.me/'+whatsapp+'?text='+encodeURIComponent('Olá, Bartos! Tenho interesse no produto '+p.nome+' ('+p.codigo+'). Poderiam me passar mais informações?');d.append(title,desc,price,buy);card.append(photo,d);gallery.append(card)});sec.append(h,gallery);catalog.append(sec)})}search.addEventListener('input',render);render();</script></body></html>
